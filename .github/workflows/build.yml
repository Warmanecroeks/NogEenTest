name: Build MomentumFishing.exe

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-2025

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MomentumFishing-Windows-x64
          path: build/Release/MomentumFishing.exe
