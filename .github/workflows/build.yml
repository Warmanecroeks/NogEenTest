name: Build MomentumFishing.exe

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build MomentumFishing.exe
        shell: cmd
        run: |
          cl /nologo /EHsc /O2 /std:c++17 /DUNICODE /D_UNICODE MomentumFishing.cpp /Fe:MomentumFishing.exe user32.lib gdi32.lib shell32.lib

      - name: Upload MomentumFishing.exe
        uses: actions/upload-artifact@v4
        with:
          name: MomentumFishing-Windows-x64
          path: MomentumFishing.exe
